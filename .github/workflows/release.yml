name: release

# Publishes the NuGet packages when a version tag is pushed. nuget.org trusts this
# workflow through Trusted Publishing: the job exchanges its GitHub identity token for
# a short-lived API key, so no key is stored in the repository or its secrets.
#
# Jobs, each with only the permissions it needs:
#   verify    the tag is well formed, on main, CI passed on that commit, the changelog has the version
#   publish   build, test, pack, attest, push to nuget.org
#   binaries  NativeAOT `oneecma` for four platforms, archived with checksums
#   release   create the GitHub release with the changelog section as notes, packages and binaries attached
on:
  push:
    tags: ['v*']

permissions: {}

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Actions are pinned by commit because the publish job can obtain a publishing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is well formed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a version tag such as v1.2.3 or v1.2.3-preview.1"; exit 1; }
      - name: Tag is on main
        run: |
          # Only commits that are already on main are published.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful ci run for $GITHUB_SHA; wait for CI on this commit and push the tag again"
            exit 1
          fi
      - name: Changelog has a section for the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no \"## [$version]\" section"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write       # nuget.org Trusted Publishing and the provenance attestation
      attestations: write   # provenance for the packages
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep build output out of the checkout
        run: echo "ONEECMA_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OneEcma.slnx

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version is whatever the project builds; the tag has to say the same.
          version=$(dotnet msbuild src/RecursiveAI.OneEcma -getProperty:PackageVersion | tr -d '[:space:]')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the package version $version"
            exit 1
          fi

      # A tag that does not build and pass its tests never publishes.
      - name: Build
        run: dotnet build OneEcma.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution OneEcma.slnx -c Release --no-build --results-directory "$ONEECMA_ARTIFACTS/TestResults"

      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        # The three shipped packages share one version; symbols come out as .snupkg files where there are any.
        run: |
          dotnet pack src/RecursiveAI.OneEcma -c Release --no-build -o "$RUNNER_TEMP/packages"
          dotnet pack src/RecursiveAI.OneEcma.Generators -c Release --no-build -o "$RUNNER_TEMP/packages"
          dotnet pack src/OneEcma.Cli -c Release -o "$RUNNER_TEMP/packages"
          python3 tools/check-packages.py "$RUNNER_TEMP/packages" "${TAG#v}"
          ls -l "$RUNNER_TEMP/packages"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg

      - name: Keep the packages for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: recursiveai.org

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # --no-symbols: pushing a .nupkg would otherwise also push the .snupkg beside it, and the next lines push it again.
          dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_API_KEY" --no-symbols \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          shopt -s nullglob
          symbols=("$RUNNER_TEMP"/packages/*.snupkg)
          if [ "${#symbols[@]}" -gt 0 ]; then
            dotnet nuget push "$RUNNER_TEMP/packages/*.snupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi

  binaries:
    needs: verify
    name: oneecma ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep build output out of the checkout
        run: echo "ONEECMA_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish NativeAOT CLI
        run: dotnet publish src/OneEcma.Cli -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/cli"

      - name: Binary reports the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "${{ matrix.rid }}" = "win-x64" ]; then ext=".exe"; fi
          got=$("$RUNNER_TEMP/cli/oneecma$ext" --version | tr -d '[:space:]')
          if [ "$got" != "${TAG#v}" ]; then echo "::error::oneecma --version prints $got, expected ${TAG#v}"; exit 1; fi

      - name: Archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          name="oneecma-$version-${{ matrix.rid }}"
          ext=""
          if [ "${{ matrix.rid }}" = "win-x64" ]; then ext=".exe"; fi
          mkdir -p "$RUNNER_TEMP/stage/$name" "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/cli/oneecma$ext" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md README.md "$RUNNER_TEMP/stage/$name/"
          cd "$RUNNER_TEMP/stage"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            archive="$name.zip"
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$RUNNER_TEMP/dist/$archive'"
          else
            archive="$name.tar.gz"
            tar -czf "$RUNNER_TEMP/dist/$archive" "$name"
          fi
          cd "$RUNNER_TEMP/dist"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.rid }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # The notes are the changelog section of this version: from its heading up to the
          # next version heading or the link definitions at the end of the file.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::the changelog section for $version is empty"; exit 1; fi
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          ls -l assets
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" assets/*
